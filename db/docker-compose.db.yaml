version: '3.8'

services:
  postgres_consortium:
    image: postgres:16-alpine
    container_name: crop_insurance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin_user}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-AdminSecure2026!}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_consortium_data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-admin_user} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_consortium_data:
    driver: local
